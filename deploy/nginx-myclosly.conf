server {
    listen 80;
    server_name api.myclosly.com;

    # Allow clothing/outfit photo uploads up to 25MB (default in Nginx is 1MB)
    client_max_body_size 25M;

    # Secure logging: strip query strings from access logs to prevent token/ticket exposure (SR-09)
    log_format secure_combined '$remote_addr - $remote_user [$time_local] '
                               '"$request_method $uri $server_protocol" '
                               '$status $body_bytes_sent "$http_referer" '
                               '"$http_user_agent"';
    access_log /var/log/nginx/access.log secure_combined;

    # Serve uploaded media files directly if stored locally
    location /media/ {
        alias /home/dev/myclosly/media/;
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Forward all API, Admin, Docs, and WebSocket requests to Daphne (Port 8000)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Required for Django Channels WebSockets (Direct Messaging / Chat)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Pass real client IP and HTTPS protocol info to Django
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer timeouts so AI Dress Analyzer requests do not time out
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
    }
}
