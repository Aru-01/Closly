# Nginx Configuration for myclosly Production (api.myclosly.com)
# Enforces HTTP->HTTPS 301, TLS 1.2/1.3, HSTS, Secure Logging, Internal Media Protection, and Daphne Proxying.

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=myc_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=myc_admin_limit:10m rate=5r/s;

# 1. Plain HTTP Port 80 -> HTTPS 301 Permanent Redirect (P-08)
server {
    listen 80;
    listen [::]:80;
    server_name api.myclosly.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Port 443 Server Block (P-08)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.myclosly.com;

    # SSL Certificates (Let's Encrypt / Certbot paths)
    ssl_certificate /etc/letsencrypt/live/api.myclosly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.myclosly.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Production Security Headers (P-08)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Standardized upload body size limit: 10MB (P-12)
    client_max_body_size 10M;

    # Secure logging: strip query strings from access logs to prevent token/ticket exposure (SR-09, P-10)
    log_format secure_combined '$remote_addr - $remote_user [$time_local] '
                               '"$request_method $uri $server_protocol" '
                               '$status $body_bytes_sent "$http_referer" '
                               '"$http_user_agent"';
    access_log /var/log/nginx/access.log secure_combined;

    # Protected Media: Internal X-Accel-Redirect only (P-04)
    # Never expose raw media files directly to the open public internet.
    location /protected_media/ {
        internal;
        alias /app/media/;
        expires 15m;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Static Assets (WhiteNoise cacheable)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Admin Portal Rate Limiting & Protection (P-07)
    location /admin/ {
        limit_req zone=myc_admin_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
    }

    # Application Gateway & Daphne Reverse Proxy (Port 8000)
    location / {
        limit_req zone=myc_api_limit burst=50 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket support for Django Channels (Chat / Real-Time)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward real client identifiers and enforce HTTPS scheme
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Drop client-supplied X-Forwarded-Host header to eliminate Host header poisoning (P-01)
        proxy_set_header X-Forwarded-Host "";

        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
    }
}
