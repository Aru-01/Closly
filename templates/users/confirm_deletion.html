<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Account Deletion - Closly</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; padding: 40px 20px; max-width: 520px; margin: auto; background-color: #FAFAFA; color: #1F2937; }
        .container { border: 1px solid #E5E7EB; padding: 36px; border-radius: 12px; background-color: #FFFFFF; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); text-align: center; }
        h1 { color: #DC2626; font-size: 24px; margin-bottom: 12px; }
        p { color: #4B5563; font-size: 15px; margin-bottom: 24px; }
        .btn-delete { background-color: #DC2626; color: #FFFFFF; border: none; padding: 12px 28px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; width: 100%; }
        .btn-delete:hover { background-color: #B91C1C; }
        .warning-box { background-color: #FEF2F2; border: 1px solid #FCA5A5; border-radius: 8px; padding: 14px; margin-bottom: 20px; font-size: 13px; color: #991B1B; text-align: left; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Confirm Permanent Deletion</h1>
        <p>You have requested to permanently delete your Closly account (<strong>{{ email }}</strong>).</p>
        <div class="warning-box">
            <strong>Warning:</strong> This action cannot be undone. All your closet items, outfits, saved looks, and associated personal data will be completely and permanently erased.
        </div>
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn-delete" id="confirm-deletion-btn">Permanently Delete My Account</button>
        </form>
    </div>
</body>
</html>
